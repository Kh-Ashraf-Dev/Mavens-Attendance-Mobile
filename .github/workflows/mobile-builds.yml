name: Mobile APK and IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore stable Android testing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mavens-testing.keystore"
          chmod 600 "$RUNNER_TEMP/mavens-testing.keystore"
      - run: flutter pub get --enforce-lockfile
      - name: Build release-mode testing APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mavens-testing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          flutter build apk --release --build-number="$BUILD_NUMBER" --dart-define-from-file=config/testing.json
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/mavens-attendance-android.apk
          python3 ci/verify_artifact.py artifacts/mavens-attendance-android.apk
          (cd artifacts && sha256sum mavens-attendance-android.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mavens-android-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mavens-testing.keystore"

  ios:
    name: iOS IPA for iLoader
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Show Xcode and device SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned physical-device app
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER" --dart-define-from-file=config/testing.json
      - name: Package and verify IPA
        run: |
          python3 ci/package_ipa.py
          python3 ci/verify_artifact.py artifacts/mavens-attendance-ios-unsigned.ipa
          (cd artifacts && shasum -a 256 mavens-attendance-ios-unsigned.ipa > SHA256SUMS.txt)
          echo '### iOS download' >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the iOS artifact ZIP, then select mavens-attendance-ios-unsigned.ipa in iLoader. This is a release-mode device build; iLoader must sign it before installation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mavens-ios-ipa-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
