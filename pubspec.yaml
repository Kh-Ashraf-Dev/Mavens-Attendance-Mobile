name: mavens_attendee
description: Mavens attendance, annual leave and team communication.
publish_to: none
version: 1.1.0+4
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  dio: ^5.8.0
  dartz: ^0.10.1
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  timezone: ^0.11.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/mavens-logo.png
    - assets/images/mavens-logo-white.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
